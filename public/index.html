<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landmark Duel — Geo 1v1</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"><script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="styles.css"></head><body>
<div id="game"><header><div class="brand">LANDMARK <b>DUEL</b><small>360° WORLD 1v1</small></div><div class="round">ROUND <b id="round">—</b></div><div class="clock"><b id="timer">60</b></div></header>
<section id="lobby" class="overlay"><div class="card"><div class="kicker">LANDMARK DUEL · GEO MODE · V20.2</div><h1>360° WORLD DUEL</h1><p id="status">Свързване…</p><p class="ok">Без Google API ключ. 360° изображенията са от KartaView, картата е OpenStreetMap.</p><input id="name" placeholder="Твоето име" maxlength="28"><div class="row"><button id="create">CREATE ROOM</button><input id="code" placeholder="ROOM CODE" maxlength="6"><button id="join">JOIN</button></div><button id="demo" class="demo">▶ DEMO SOLO — ТЕСТВАЙ ВЕДНАГА</button><div id="roomBox" class="hidden"><div>ROOM: <b id="roomCode">------</b></div><div class="shareRow"><input id="shareLink" readonly><button id="copyLink">COPY LINK</button></div><div id="players">Чакаме втори играч…</div><button id="start" class="hidden">START 1v1</button></div><div id="error"></div></div></section>
<main><div id="street"></div><div id="streetLoading">Зареждам 360° улица…</div><button id="back" class="nav left">◀</button><button id="forward" class="nav right">▶</button><button id="mapToggle">КАРТА 🌍</button>
<div id="guessPanel" class="mapPanel hidden"><div id="guessMap"></div><button id="guessBtn" disabled>GUESS</button></div>
<div id="resultPanel" class="result hidden"><h2 id="resultTitle"></h2><div id="resultMap"></div><p id="resultText"></p></div>
</main>
<footer><div class="player blue"><span id="p1Name">YOU</span><b><span id="p1Hp">5000</span> HP</b><em id="p1Status">WAITING</em></div><div class="player red"><span id="p2Name">OPPONENT</span><b><span id="p2Hp">5000</span> HP</b><em id="p2Status">WAITING</em></div></footer></div>
<script src="app.js"></script></body></html>
